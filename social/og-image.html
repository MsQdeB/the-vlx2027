<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OG image source — render at 1200×630</title>
<!--
  Source for og-image.png (the Open Graph / social share card).
  Regenerate:  render this file at width 1200, then crop to 1200×630.
-->
<style>
  :root{
    --paper:#f4efe2; --paper2:#ede6d4; --paper3:#e6dcc4;
    --ink:#1b1713; --soft:#4c453a; --faint:#857c6b;
    --rule:#16120e; --hair:#c6bba2; --red:#8a2a1e; --gold:#a87c26;
    --serif:'Lora',Georgia,serif; --display:'Playfair Display',Georgia,serif;
    --sans:'Libre Franklin',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
  .grain{position:absolute;inset:0;background:
    radial-gradient(circle at 16% 20%, rgba(27,23,19,.05) 0, transparent 42%),
    radial-gradient(circle at 84% 80%, rgba(27,23,19,.07) 0, transparent 50%);}
  .frame{position:absolute;inset:26px;border:1.5px solid var(--rule);outline:5px solid rgba(22,18,14,.07)}
  .inner{position:absolute;inset:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:46px 70px}
  .toprule{position:absolute;top:52px;left:70px;right:70px;border-top:4px solid var(--rule)}
  .org{position:absolute;top:66px;left:0;right:0;font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:var(--faint)}
  .org b{color:var(--ink)}

  .eyebrow{font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.44em;text-transform:uppercase;color:var(--red);margin-top:44px}
  h1{font-family:var(--display);font-weight:700;font-size:66px;line-height:1.14;margin-top:20px}
  h1 .em{font-style:italic;color:var(--red)}
  .return{font-family:var(--display);font-weight:800;font-size:38px;margin-top:22px}
  .return .yr{color:var(--red)}
  .chip{display:inline-block;font-family:var(--sans);font-size:16px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:12px 26px;margin-top:28px}
  .foot{position:absolute;bottom:52px;left:70px;right:70px;display:flex;justify-content:space-between;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);border-top:1px solid var(--hair);padding-top:14px}
  .foot b{color:var(--ink)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700;800&family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="grain"></div>
  <div class="frame"></div>
  <div class="inner">
    <div class="toprule"></div>
    <div class="org"><b>Vietnam Lindy Exchange</b> &nbsp;·&nbsp; Est. 2009</div>

    <div class="eyebrow">The 17th edition</div>
    <h1>We've been waiting.<br>You've been <span class="em">waiting.</span></h1>
    <div class="return">We will return in <span class="yr">2027</span>.</div>
    <div class="chip">Dates announced &nbsp;·&nbsp; 19 September 2026</div>
  </div>
  <div class="foot">
    <span><b>9 PM Vietnam time (GMT+7)</b></span>
    <span>@vietnamlindyexchange</span>
  </div>
</body>
</html>
