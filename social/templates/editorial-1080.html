<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300..900;1,300..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
      @font-face { font-family: 'Chomsky'; src: url('assets/fonts/chomsky.woff') format('woff'); }

      html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; overflow: hidden; background: #f4efe2; }
      .card {
        width: 1080px; height: 1080px; box-sizing: border-box;
        background: #f4efe2; color: #1b1713; font-family: 'Lora', Georgia, serif;
        padding: 30px; 
      }
      .frame { border: 1px solid #16120e; height: 100%; box-sizing: border-box; padding: 46px 52px 40px; display: flex; flex-direction: column; }
      .toprow { display: flex; justify-content: space-between; font-family: 'Libre Franklin', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: #4c453a; }
      .rule2 { border-top: 3px solid #16120e; border-bottom: 1px solid #16120e; height: 5px; margin: 12px 0 0; }
      .kicker { font-family: 'Libre Franklin', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.4em; text-transform: uppercase; color: #8a2a1e; text-align: center; margin-top: 44px; }
      .mast { font-family: 'Chomsky', serif; font-size: 92px; text-align: center; line-height: 1; margin: 6px 0 0; }
      .sub { font-family: 'Libre Franklin', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; text-align: center; color: #857c6b; margin-top: 12px; }
      .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
      .headline { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 92px; line-height: 1.02; margin: 0; }
      .big { font-family: 'Libre Franklin', sans-serif; font-weight: 800; font-size: 46px; letter-spacing: 0.04em; margin: 26px 0 0; }
      .tag { font-family: 'Lora', serif; font-style: italic; font-size: 30px; color: #4c453a; margin-top: 18px; }
      .cta { display: inline-block; margin: 34px auto 0; font-family: 'Libre Franklin', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; background: #1b1713; color: #f4efe2; padding: 18px 40px; }
      .foot { display: flex; justify-content: space-between; align-items: center; font-family: 'Libre Franklin', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #4c453a; border-top: 3px double #16120e; padding-top: 16px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="frame">
        <div class="toprow"><span>Hội An, Vietnam</span><span>Vol. XVII</span></div>
        <div class="rule2"></div>
        <div class="kicker">Registration</div>
        <div class="mast">The VLX</div>
        <div class="sub">Vietnam Lindy Exchange · Est. 2009</div>
        <div class="mid">
          <h1 class="headline">Registration opens soon</h1>
          <div class="big">SATURDAY 10 OCTOBER · 16:00 (GMT+7)</div>
          <div class="tag">Group registration — groups of 8–10 dancers, only 10 groups</div>
          <span class="cta">thevlx.net</span>
        </div>
        <div class="foot"><span>VLX 2027</span><span>19–21 March 2027</span><span>Hội An</span></div>
      </div>
    </div>
  </body>
</html>
