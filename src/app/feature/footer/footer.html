<footer class="footer-container" id="contact">
  <div class="footer-content">
    <h2 class="footer-title">CONTACT US</h2>

    <div class="social-links">
      <a
        [href]="socialLinks.facebookPage"
        target="_blank"
        rel="noopener noreferrer"
        class="social-link"
      >
        <i class="fab fa-facebook-square"></i>
        <span>Facebook Page</span>
      </a>

      <a
        [href]="socialLinks.facebookGroup"
        target="_blank"
        rel="noopener noreferrer"
        class="social-link"
      >
        <i class="fab fa-facebook"></i>
        <span>Facebook Group</span>
      </a>

      <a
        [href]="socialLinks.instagram"
        target="_blank"
        rel="noopener noreferrer"
        class="social-link"
      >
        <i class="fab fa-instagram"></i>
        <span>Instagram</span>
      </a>
    </div>

    <div class="footer-copyright">
      <p class="copyright-text">
        © {{ currentYear }} THE VIETNAM LINDY EXCHANGE, All Rights Reserved
      </p>
      <p class="contact-email">
        <a href="mailto:info.thevlx@gmail.com">info.thevlx&#64;gmail.com</a>
      </p>
    </div>
  </div>
</footer>
