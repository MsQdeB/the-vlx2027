<div class="livebands-container" id="live-bands">
  <div class="livebands-content">
    <h2 class="livebands-title">LIVE BANDS</h2>
    <p class="band-note">More bands & international DJs to be announced — follow us on social media.</p>

    <div class="bands-grid">
      <div class="band-card" *ngFor="let band of bands">
        <div class="band-image-wrapper">
          <h3 class="band-name">{{ band.name }}</h3>
          <div class="band-image">
            <img [src]="band.image" [alt]="band.name" class="band-photo" loading="lazy" />
          </div>
        </div>
        <p class="band-description" [innerHTML]="band.description"></p>
      </div>
    </div>
  </div>
</div>
