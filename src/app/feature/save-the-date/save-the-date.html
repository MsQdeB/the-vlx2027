<div class="save-container" id="save-the-date">
  <div class="save-content">
    <div class="save-eyebrow">Notice to all dancers</div>
    <h2 class="save-title">Save the dates</h2>
    <p class="save-lead">
      Friday 19<sup>th</sup> — Sunday 21<sup>st</sup> March 2027, Hội An, Vietnam.
      Put it in the calendar now; the details will follow in this paper.
    </p>

    <div class="save-buttons">
      <a class="save-btn" [href]="googleUrl" target="_blank" rel="noopener noreferrer">
        Google Calendar
      </a>
      <a class="save-btn" [href]="outlookUrl" target="_blank" rel="noopener noreferrer">
        Outlook
      </a>
      <a class="save-btn" [href]="yahooUrl" target="_blank" rel="noopener noreferrer">
        Yahoo
      </a>
      <a class="save-btn" [href]="icsUrl" download="vlx-2027.ics">
        Apple / .ics file
      </a>
    </div>
    <p class="save-note">Three days, three nights — all times Vietnam time (GMT+7).</p>
  </div>
</div>
