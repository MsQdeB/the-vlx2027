<div class="youtube-container" id="highlights">
  <div class="youtube-content">
    <h2 class="youtube-heading">VLX HIGHLIGHTS</h2>
    <p class="youtube-note">The VLX 2027 after-movie will land here after the event — enjoy the 2024 highlights meanwhile.</p>
    <div class="videos-grid">
      <div class="video-card" *ngFor="let video of videos">
        <div class="video-wrapper">
          <iframe
            [src]="video.embedUrl"
            [title]="video.title"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
        <h3 class="video-title">{{ video.title }}</h3>
      </div>
    </div>
  </div>
</div>
